[package]
name = "mage_sim"
description = "The deterministic, headless tick simulation of Mage Game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# No windowing, rendering, audio or threads: the simulation must run headless and build for
# wasm32 (ADR-0020, ADR-0024). Avian without `parallel` (threads) and without `debug-plugin`
# (rendering); only what static colliders, spatial queries and MoveAndSlide need (ADR-0003).
avian3d = { workspace = true, features = ["3d", "parry-f32"] }
bevy = { workspace = true, features = ["std"] }

# Bevy always links android-activity on Android, which only compiles once the app picks an
# implementation; the client does that through bevy_winit, which the simulation must not use.
# This feature picks one so that CI can `cargo check` mage_sim for Android on its own (B-002).
# The client never enables it.
[features]
android-check = ["dep:android-activity", "android-activity/native-activity"]

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", optional = true }
