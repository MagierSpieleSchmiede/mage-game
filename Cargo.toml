[workspace]
resolver = "3"
members = ["crates/mage_sim", "crates/mage_client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"

# Versions live here; each crate picks its own features (ADR-0020).
[workspace.dependencies]
avian3d = { version = "0.8.0", default-features = false }
bevy = { version = "0.20.1", default-features = false }
mage_sim = { path = "crates/mage_sim" }
